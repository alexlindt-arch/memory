    document.querySelectorAll('[data-pick]').forEach(function (row) {
      var kind = row.getAttribute("data-pick");
      var value = row.getAttribute("data-value");
      var dot = row.querySelector(".dot");
      var selected = String(state[kind]) === value;
      if (kind === "player") {
        dot.setAttribute("fill", selected ? playerColors[value] : "transparent");
      } else {
        dot.setAttribute("fill", selected ? "#303131" : "transparent");
      }
    });

    // Start button state
    var ready = state.player !== null && state.size !== null;
    startBtn.style.background = ready ? "#F0EA6E" : "#D9D9D9";
    startBtn.style.cursor = ready ? "pointer" : "not-allowed";
    var fg = ready ? "#303131" : "#AFAFAF";
    startIconPath.setAttribute("fill", fg);
    startLabel.style.color = fg;
    startBtn.setAttribute("href", ready ? encodeURI(boards[state.size]) : "#");
    startBtn.dataset.ready = ready ? "1" : "0";
  }

  // Selection handlers
  document.querySelectorAll('[data-pick]').forEach(function (row) {
    row.addEventListener("click", function () {
      var kind = row.getAttribute("data-pick");
      state[kind] = parseInt(row.getAttribute("data-value"), 10);
      render();
    });
  });

  // Start button: hover + guard when not ready
  startBtn.addEventListener("mouseenter", function () {
    if (startBtn.dataset.ready === "1") {
      startBtn.style.transform = "scale(1.06)";
      startIcon.style.transform = "rotate(-10deg)";
    }
  });
  startBtn.addEventListener("mouseleave", function () {
    startBtn.style.transform = "scale(1)";
    startIcon.style.transform = "rotate(0deg)";
  });
  startBtn.addEventListener("click", function (e) {
    if (startBtn.dataset.ready !== "1") { e.preventDefault(); }
  });

  // Scale the fixed 1440x1024 canvas down on narrow viewports
  var canvas = document.querySelector(".canvas");
  function fit() {
    var scale = Math.min(1, window.innerWidth / 1440);
    canvas.style.transform = "scale(" + scale + ")";
    document.querySelector(".stage").style.height = (1024 * scale) + "px";
  }
  window.addEventListener("resize", fit);

  fit();
  render();
})();
</script>
</body>
</html>
